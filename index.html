<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>XiX Tech CRM</title>
    <meta name="description" content="CRM de ventas a crédito: clientes, cobranzas y ruta de cobro." />

    <!-- Iconos. El SVG es el que usan los navegadores modernos (se ve nítido en
         cualquier tamaño); el .ico es el respaldo para los viejos y para los
         accesos directos de Windows. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Permite instalarlo como aplicación en PC y en el teléfono. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#161826" />
    <meta name="application-name" content="XiX CRM" />
    <meta name="apple-mobile-web-app-title" content="XiX CRM" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Quicksand: fuente redonda, solo para las píldoras de estado. -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
